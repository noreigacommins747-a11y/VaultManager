<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全能账号密码管理器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🔐</span>
            <h1 class="text-xl font-bold text-slate-900">VaultManager <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-1 rounded">本地离线版</span></h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openCategoryModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition cursor-pointer">📁 分类管理</button>
            <button onclick="openGeneratorModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg text-sm font-medium transition cursor-pointer">🎲 强密码生成</button>
            <button onclick="exportData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition cursor-pointer">📤 备份</button>
            <button onclick="importData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-medium transition cursor-pointer">📥 恢复</button>
        </div>
    </header>

    <!-- 主体区域 -->
    <div class="flex flex-1 overflow-hidden">
        <!-- 左侧列表 -->
        <div class="w-1/3 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-4 border-b border-slate-100 space-y-3">
                <input type="text" id="searchInput" oninput="renderList()" placeholder="🔍 搜索平台、账号、备注..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex gap-2">
                    <select id="categoryFilter" onchange="renderList()" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none">
                        <option value="all">全部分类</option>
                    </select>
                </div>
            </div>
            <div id="accountList" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <!-- 列表项由JS动态渲染 -->
            </div>
            <div class="p-4 border-t border-slate-100">
                <button onclick="openAccountModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium shadow-sm transition cursor-pointer">+ 添加新账号</button>
            </div>
        </div>

        <!-- 右侧详情 -->
        <div class="w-2/3 bg-slate-50 p-8 flex flex-col overflow-y-auto" id="detailPanel">
            <div class="text-center text-slate-400 my-auto">
                <p class="text-lg">请在左侧选择一个账号查看详情</p>
            </div>
        </div>
    </div>

    <!-- 账号弹窗 (添加/编辑) -->
    <div id="accountModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl space-y-4">
            <h3 id="modalTitle" class="text-lg font-bold text-slate-900">添加账号</h3>
            <input type="hidden" id="accId">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">平台 / 应用名称 *</label>
                <input type="text" id="accPlatform" placeholder="例如：Instagram / Gmail" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">账号类型</label>
                <select id="accCategory" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white"></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">账号 / 邮箱 / 用户名</label>
                <input type="text" id="accUsername" placeholder="username@example.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">密码</label>
                <div class="flex gap-2">
                    <input type="text" id="accPassword" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm font-mono">
                    <button onclick="generateRandomPwd()" class="bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg text-xs font-medium shrink-0 cursor-pointer">随机生成</button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">网址 / App 链接</label>
                <input type="text" id="accUrl" placeholder="https://..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">特殊要求 / 备注 (如 2FA、密保问题等)</label>
                <textarea id="accNote" rows="3" placeholder="记录特殊安全要求、密保答案等..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></textarea>
            </div>
            <div class="flex justify-end space-x-3 pt-2">
                <button onclick="closeAccountModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg cursor-pointer">取消</button>
                <button onclick="saveAccount()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 cursor-pointer">保存</button>
            </div>
        </div>
    </div>

    <!-- 分类管理弹窗 -->
    <div id="categoryModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-900">分类管理</h3>
            <div id="categoryListContainer" class="space-y-2 max-h-48 overflow-y-auto"></div>
            <div class="flex gap-2 pt-2">
                <input type="text" id="newCategoryName" placeholder="新分类名称" class="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm">
                <button onclick="addCategory()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700 cursor-pointer">添加</button>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="closeCategoryModal()" class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer">关闭</button>
            </div>
        </div>
    </div>

    <!-- 强密码生成器弹窗 -->
    <div id="generatorModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-xl space-y-4">
            <h3 class="text-lg font-bold text-slate-900">强密码生成器</h3>
            <div class="bg-slate-100 p-3 rounded-xl flex items-center justify-between font-mono text-lg font-bold">
                <span id="genResultText"></span>
                <button onclick="copyText(document.getElementById('genResultText').innerText)" class="text-xs bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg cursor-pointer">复制</button>
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="closeGeneratorModal()" class="px-4 py-2 text-sm bg-slate-100 hover:bg-slate-200 rounded-lg cursor-pointer">关闭</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vault_db')) || {
            categories: [
                { id: 'email', name: '邮箱账号' },
                { id: 'social', name: '社交媒体 (INS/X等)' },
                { id: 'game', name: '游戏账号' },
                { id: 'other', name: '其他类型' }
            ],
            accounts: []
        };

        let currentSelectedId = null;

        function saveDb() {
            localStorage.setItem('vault_db', JSON.stringify(db));
            initCategories();
            renderList();
        }

        function initCategories() {
            const selects = [document.getElementById('categoryFilter'), document.getElementById('accCategory')];
            selects.forEach((sel, idx) => {
                const currentVal = sel.value;
                sel.innerHTML = idx === 0 ? '<option value="all">全部分类</option>' : '';
                db.categories.forEach(c => {
                    sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                });
                sel.value = currentVal;
            });
        }

        function renderList() {
            initCategories();
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filterCat = document.getElementById('categoryFilter').value;
            const listEl = document.getElementById('accountList');
            listEl.innerHTML = '';

            const filtered = db.accounts.filter(acc => {
                const matchCat = filterCat === 'all' || acc.category === filterCat;
                const matchKey = (acc.platform + acc.username + (acc.note || '')).toLowerCase().includes(keyword);
                return matchCat && matchKey;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">暂无账号数据</div>`;
                return;
            }

            filtered.forEach(acc => {
                const catObj = db.categories.find(c => c.id === acc.category);
                const catName = catObj ? catObj.name : '其他';
                const isSelected = currentSelectedId === acc.id;
                listEl.innerHTML += `
                    <div onclick="selectAccount('${acc.id}')" class="p-4 cursor-pointer transition hover:bg-slate-50 ${isSelected ? 'bg-indigo-50/60 border-l-4 border-indigo-600' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-slate-900">${acc.platform}</span>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${catName}</span>
                        </div>
                        <div class="text-xs text-slate-500 truncate">${acc.username || '无账号名'}</div>
                    </div>
                `;
            });
        }

        function selectAccount(id) {
            currentSelectedId = id;
            renderList();
            const acc = db.accounts.find(a => a.id === id);
            if (!acc) return;
            const catObj = db.categories.find(c => c.id === acc.category);
            const panel = document.getElementById('detailPanel');
            panel.innerHTML = `
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6 max-w-2xl">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">${acc.platform}</h2>
                            <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium inline-block mt-1">${catObj ? catObj.name : '其他'}</span>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="openAccountModal('${acc.id}')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer">编辑</button>
                            <button onclick="deleteAccount('${acc.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-medium cursor-pointer">删除</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="block text-xs text-slate-400 mb-1">账号 / 邮箱</span>
                            <div class="flex justify-between items-center">
                                <span class="font-medium text-sm text-slate-800">${acc.username || '未填写'}</span>
                                ${acc.username ? `<button onclick="copyText('${acc.username}')" class="text-xs text-indigo-600 hover:underline cursor-pointer">复制</button>` : ''}
                            </div>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="block text-xs text-slate-400 mb-1">密码</span>
                            <div class="flex justify-between items-center">
                                <span id="pwdDisplay" class="font-mono text-sm text-slate-800">••••••••</span>
                                <div class="space-x-2">
                                    <button onclick="togglePwd('${acc.password}')" id="toggleBtn" class="text-xs text-slate-500 hover:underline cursor-pointer">显示</button>
                                    <button onclick="copyText('${acc.password}')" class="text-xs text-indigo-600 hover:underline cursor-pointer">复制</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${acc.url ? `<div><span class="block text-xs text-slate-400 mb-1">网址 / App 链接</span><a href="${acc.url}" target="_blank" class="text-sm text-indigo-600 hover:underline break-all">${acc.url}</a></div>` : ''}
                    <div>
                        <span class="block text-xs text-slate-400 mb-1">特殊要求 / 备注</span>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-sm text-slate-700 whitespace-pre-wrap">${acc.note || '无特殊要求'}</div>
                    </div>
                </div>
            `;
        }

        let pwdVisible = false;
        function togglePwd(pwd) {
            const span = document.getElementById('pwdDisplay');
            const btn = document.getElementById('toggleBtn');
            pwdVisible = !pwdVisible;
            if (pwdVisible) {
                span.innerText = pwd;
                btn.innerText = '隐藏';
            } else {
                span.innerText = '••••••••';
                btn.innerText = '显示';
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('已成功复制到剪贴板！');
            });
        }

        function openAccountModal(id = null) {
            initCategories();
            document.getElementById('accountModal').classList.remove('hidden');
            document.getElementById('accountModal').classList.add('flex');
            if (id) {
                document.getElementById('modalTitle').innerText = '编辑账号';
                const acc = db.accounts.find(a => a.id === id);
                document.getElementById('accId').value = acc.id;
                document.getElementById('accPlatform').value = acc.platform;
                document.getElementById('accCategory').value = acc.category;
                document.getElementById('accUsername').value = acc.username;
                document.getElementById('accPassword').value = acc.password;
                document.getElementById('accUrl').value = acc.url || '';
                document.getElementById('accNote').value = acc.note || '';
            } else {
                document.getElementById('modalTitle').innerText = '添加账号';
                document.getElementById('accId').value = '';
                document.getElementById('accPlatform').value = '';
                document.getElementById('accUsername').value = '';
                document.getElementById('accPassword').value = '';
                document.getElementById('accUrl').value = '';
                document.getElementById('accNote').value = '';
            }
        }

        function closeAccountModal() {
            document.getElementById('accountModal').classList.remove('flex');
            document.getElementById('accountModal').classList.add('hidden');
        }

        function saveAccount() {
            const id = document.getElementById('accId').value;
            const platform = document.getElementById('accPlatform').value.trim();
            if (!platform) {
                alert('请输入平台名称！');
                return;
            }
            const data = {
                id: id || 'acc_' + Date.now(),
                platform,
                category: document.getElementById('accCategory').value,
                username: document.getElementById('accUsername').value.trim(),
                password: document.getElementById('accPassword').value,
                url: document.getElementById('accUrl').value.trim(),
                note: document.getElementById('accNote').value.trim()
            };

            if (id) {
                const index = db.accounts.findIndex(a => a.id === id);
                db.accounts[index] = data;
            } else {
                db.accounts.push(data);
            }
            saveDb();
            closeAccountModal();
            selectAccount(data.id);
        }

        function deleteAccount(id) {
            if (confirm('确定要删除这个账号吗？')) {
                db.accounts = db.accounts.filter(a => a.id !== id);
                currentSelectedId = null;
                saveDb();
                document.getElementById('detailPanel').innerHTML = `<div class="text-center text-slate-400 my-auto"><p class="text-lg">请在左侧选择一个账号查看详情</p></div>`;
            }
        }

        function generateRandomPwd() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
            let pwd = "";
            for (let i = 0; i < 16; i++) {
                pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('accPassword').value = pwd;
        }

        function openCategoryModal() {
            document.getElementById('categoryModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('flex');
            renderCategoryList();
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('flex');
            document.getElementById('categoryModal').classList.add('hidden');
        }

        function renderCategoryList() {
            const container = document.getElementById('categoryListContainer');
            container.innerHTML = '';
            db.categories.forEach(c => {
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-lg text-sm">
                        <span>${c.name}</span>
                        ${db.categories.length > 1 ? `<button onclick="deleteCategory('${c.id}')" class="text-xs text-rose-600 hover:underline cursor-pointer">删除</button>` : ''}
                    </div>
                `;
            });
        }

        function addCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) return;
            const id = 'cat_' + Date.now();
            db.categories.push({ id, name });
            document.getElementById('newCategoryName').value = '';
            saveDb();
            renderCategoryList();
        }

        function deleteCategory(id) {
            db.categories = db.categories.filter(c => c.id !== id);
            saveDb();
            renderCategoryList();
        }

        function openGeneratorModal() {
            document.getElementById('generatorModal').classList.remove('hidden');
            document.getElementById('generatorModal').classList.add('flex');
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
            let pwd = "";
            for (let i = 0; i < 16; i++) pwd += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('genResultText').innerText = pwd;
        }

        function closeGeneratorModal() {
            document.getElementById('generatorModal').classList.remove('hidden');
            document.getElementById('generatorModal').classList.remove('flex');
            document.getElementById('generatorModal').classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "vault_backup.json");
            dlAnchor.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    try {
                        db = JSON.parse(readerEvent.target.result);
                        saveDb();
                        alert('恢复成功！');
                    } catch (err) {
                        alert('文件格式错误！');
                    }
                }
            };
            input.click();
        }

        initCategories();
        renderList();
    </script>
</body>
</html>
